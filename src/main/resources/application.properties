spring.application.name=inasistencias

# Servidor web local
server.port=8080

# Conexion al SGBD MySQL (esquema inasistencias)
# La contrasena NO se escribe aqui: se lee de la variable de entorno DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/inasistencias
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: las tablas ya existen, no se crean ni se modifican desde Java
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres de tablas y columnas tal como estan en la base de datos
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Muestra en consola las sentencias SQL que ejecuta Hibernate
spring.jpa.show-sql=true
