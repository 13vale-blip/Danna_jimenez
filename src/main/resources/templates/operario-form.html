<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${esEdicion} ? 'Editar operario' : 'Registrar operario'">Operario</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra">
    <span class="marca">Sistema de Inasistencias</span>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/operarios}">Operarios</a>
    </nav>
</header>

<main class="contenido angosto">
    <h1 th:text="${esEdicion} ? 'Editar operario' : 'Registrar operario'">Registrar operario</h1>

    <!-- Mensaje de validacion -->
    <div class="mensaje error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <!-- El mismo formulario sirve para registrar (Create) y editar (Update) -->
    <form method="post" th:object="${operario}"
          th:action="${esEdicion} ? @{/operarios/actualizar/{id}(id=*{idLogin})} : @{/operarios/guardar}">

        <label for="idLogin">ID operario</label>
        <!-- En edicion el ID es de solo lectura: no se puede modificar -->
        <input id="idLogin" type="number" min="1" th:field="*{idLogin}" th:readonly="${esEdicion}">

        <label for="nombreOperario">Nombre operario</label>
        <input id="nombreOperario" type="text" maxlength="100" th:field="*{nombreOperario}">

        <!-- Las contrasenas nunca se envian de vuelta al navegador -->
        <label for="password">Contraseña (máx. 8)</label>
        <input id="password" name="password" type="password" maxlength="8"
               th:placeholder="${esEdicion} ? 'Dejar en blanco para conservar la actual' : ''">

        <label for="confirmarPassword">Confirmar contraseña</label>
        <input id="confirmarPassword" name="confirmarPassword" type="password" maxlength="8">

        <label for="idTipoOperario">Tipo de operario (1 Administrador, 2 Auxiliar)</label>
        <input id="idTipoOperario" type="number" th:field="*{idTipoOperario}">

        <label for="idTipoDocumento">Tipo de documento (1 CC, 2 TI)</label>
        <input id="idTipoDocumento" type="number" th:field="*{idTipoDocumento}">

        <div class="acciones">
            <button type="submit" th:text="${esEdicion} ? 'Guardar cambios' : 'Registrar'">Registrar</button>
            <a class="boton secundario" th:href="@{/operarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
