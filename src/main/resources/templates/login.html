<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · Inasistencias</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra">
    <span class="marca">Sistema de Inasistencias</span>
    <nav><a th:href="@{/}">Inicio</a></nav>
</header>

<main class="contenido angosto centrado">
    <h1>Login operario</h1>

    <!-- Mensaje de error cuando el usuario o la contrasena no coinciden -->
    <div class="mensaje error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <form th:action="@{/login}" method="post">
        <label for="usuario">Usuario (nombre del operario)</label>
        <input id="usuario" name="usuario" type="text" th:value="${usuario}" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" maxlength="8" required>

        <div class="acciones">
            <button type="submit">Ingresar</button>
        </div>
    </form>
</main>
</body>
</html>
