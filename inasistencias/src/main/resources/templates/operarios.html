<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Operarios')}"></head>
<body>
<div id="abuelo">
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <nav th:replace="~{fragmentos :: menu}"></nav>
    <div th:replace="~{fragmentos :: sesion}"></div>

    <!-- MODULO 1: OPERARIOS (consulta / Read) -->
    <main class="modulo">
        <h2 class="modulo__titulo">Módulo 1. Operarios</h2>

        <div class="tarjeta-modulo">
            <div class="encabezado-modulo">
                <h3>Operarios registrados</h3>
                <a class="boton" th:href="@{/operarios/nuevo}">Registrar operario</a>
            </div>

            <!-- Mensajes que llegan despues de registrar, editar o eliminar -->
            <div class="mensaje mensaje--exito" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
            <div class="mensaje mensaje--error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

            <div class="tabla-contenedor">
                <table class="tabla-operarios">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre operario</th>
                        <th>Tipo operario</th>
                        <th>Tipo documento</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(operarios)}">
                        <td colspan="5">No hay operarios registrados.</td>
                    </tr>
                    <tr th:each="operario : ${operarios}">
                        <td th:text="${operario.idLogin}">1</td>
                        <td th:text="${operario.nombreOperario}">Nombre</td>
                        <td th:text="${operario.idTipoOperario}">1</td>
                        <td th:text="${operario.idTipoDocumento}">1</td>
                        <td>
                            <div class="acciones">
                                <a class="boton" th:href="@{/operarios/editar/{id}(id=${operario.idLogin})}">Editar</a>
                                <!-- Eliminar pide confirmacion antes de enviar -->
                                <form th:action="@{/operarios/eliminar/{id}(id=${operario.idLogin})}" method="post"
                                      th:attr="data-nombre=${operario.nombreOperario}"
                                      onsubmit="return confirm('¿Seguro que desea eliminar al operario ' + this.dataset.nombre + '?');">
                                    <button type="submit" class="boton boton--peligro">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
</div>
</body>
</html>
