<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Validación Operarios')}"></head>
<body>
<div id="abuelo">
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <nav th:replace="~{fragmentos :: menu}"></nav>

    <!-- MODULO: VALIDACION DE OPERARIOS (login) -->
    <main class="modulo">
        <h2 class="modulo__titulo">Validación Operarios</h2>

        <div class="tarjeta-modulo angosto">
            <!-- Mensaje de error cuando el usuario o la contrasena no coinciden -->
            <div class="mensaje mensaje--error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

            <form class="mi-forma" th:action="@{/login}" method="post">
                <label for="usuario">Usuario (nombre del operario):</label>
                <input id="usuario" name="usuario" type="text" th:value="${usuario}" required autofocus
                       placeholder="Ej: Maria Vargas">

                <label for="password">Contraseña:</label>
                <input id="password" name="password" type="password" maxlength="8" required>

                <button type="submit" class="boton-enviar">Ingresar</button>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
</div>
</body>
</html>
